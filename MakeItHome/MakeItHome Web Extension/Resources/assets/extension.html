<style>
#safariTabs { width: 100%; height: 100%; perspective: 1200px; }
#safariTabs .swiper-wrapper { pointer-events: none; }
#safariTabs .swiper-slide {
    pointer-events: auto;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: minmax(0, 1fr) 30px;
    align-items: center;
    justify-items: center;
    min-height: 0;
    gap: 8px;
    padding: 12px;
    cursor: pointer;
    backface-visibility: hidden;
}
#safariTabs img { width: 100%; height: 100%; min-height: 0; min-width: 0; object-fit: contain; border-radius: 6px; }
#safariTabs img[hidden] { display: none; }
#safariTabs .safari-tab-caption {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr);
    align-items: center;
    gap: 6px;
    width: 100%;
    max-width: 640px;
    padding: 5px 9px;
    box-sizing: border-box;
    color: white;
    background: rgba(0, 0, 0, .72);
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    line-height: 20px;
    text-align: center;
    flex-shrink: 0;
}
#safariTabs .safari-tab-title {
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#safariTabs .safari-tab-icon { width: 18px; height: 18px; line-height: 18px; }
#safariTabs .safari-tab-icon img { width: 18px; height: 18px; border-radius: 3px; }
</style>
<div id="safariTabs" class="safariSwiperContainer swiper swiper-container" aria-label="Safari tabs">
    <div class="swiper-wrapper"></div>
</div>
<script>
    vars.safari = vars.safari || {}
    // Identical content never re-runs this script. For a genuine content update,
    // reuse bounded runtime image nodes/order instead of emptying a warm cache.
    rememberSafariPosition(false)
    destroySwiper()
    for(const name of ['swiperRetryTimer', 'swiperRefreshTimer', 'positionTimer']){
        clearTimeout(vars.safari[name])
        vars.safari[name] = null
    }
    if(vars[(settingContentBundleId || curBundleId)+'_forceReload']){
        for(const tab of Object.values(vars.safari.tabs || {})){
            releaseSafariPreview(tab)
            releaseSafariTabIcon(tab)
        }
        vars.safari.tabs = {}
        vars.safari.tabInfos = {}
        vars.safari.inventoryReady = false
        vars.safari.order = []
        delete vars[(settingContentBundleId || curBundleId)+'_forceReload']
    }
    vars.safari.slides = vars.safari.slides || []
    vars.safari.tabs = vars.safari.tabs || {}
    vars.safari.tabInfos = vars.safari.tabInfos || {}
    vars.safari.order = vars.safari.order || vars.safari.slides.map(slide=>Number(slide.getAttribute('tabId')))
    vars.safari.restoring = false
    vars.safari.interactionUntil = 0
    for(const tab of Object.values(vars.safari.tabs)) upsertSafariTab(tab.info)
    refreshSafariSlides(true)

    function safariIsInteracting(){
        return isShowing && (Date.now() < (vars.safari.interactionUntil || 0) ||
            (vars.safari.swiper?.animating && Date.now() < (vars.safari.lastInteractionAt || 0) + 1500))
    }

    function noteSafariInteraction(event){
        const keyboard = event.type === 'keydown' && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)
        if(!isShowing || (!keyboard && !event.target?.closest('#safariTabs'))) return
        vars.safari.lastInteractionAt = Date.now()
        vars.safari.interactionUntil = Date.now() + 300
    }

    function swiperHasLayout(){
        const container = document.getElementById('safariTabs')
        if(!container || !isShowing) return false
        const bounds = container.getBoundingClientRect()
        return bounds.width > 1 && bounds.height > 1
    }

    function safariPositionIndex(){
        const position = vars.safari.position
        const slides = vars.safari.slides
        if(!position || !slides.length) return 0
        const index = slides.findIndex(slide=>Number(slide.getAttribute('tabId')) === Number(position.id))
        return index >= 0 ? index : Math.min(Math.max(0, position.index || 0), slides.length - 1)
    }

    function rememberSafariPosition(notify = true){
        const swiper = vars.safari.swiper
        if(!swiper || swiper.destroyed || vars.safari.restoring) return
        const index = swiper.activeIndex
        const slide = swiper.slides?.[index] || vars.safari.slides[index]
        if(!slide) return
        // Keep a saved tab that is still open while its preview batch is loading.
        if(vars.safari.position && vars.safari.tabInfos[vars.safari.position.id] &&
           !vars.safari.slides.some(item=>Number(item.getAttribute('tabId')) === Number(vars.safari.position.id)) &&
           !safariIsInteracting()) return
        const id = Number(slide.getAttribute('tabId'))
        vars.safari.position = {id, index}
        const size = swiper.slidesSizesGrid?.[index] || 1
        vars.safari.positionOffset = (swiper.translate + (swiper.slidesGrid?.[index] || 0)) / size || 0
        clearTimeout(vars.safari.positionTimer)
        if(notify && isShowing){
            // Coalesce wheel/drag changes; persist only an ID and fallback index.
            vars.safari.positionTimer = setTimeout(()=>{
                vars.safari.positionTimer = null
                sendStatus(JSON.stringify({type: 'tabPosition', ...vars.safari.position}))
            }, 250)
        }
    }

    function restoreSafariPosition(){
        const swiper = vars.safari.swiper
        if(!swiper || swiper.destroyed) return
        vars.safari.restoring = true
        const index = safariPositionIndex()
        swiper.slideTo(index, 0, false)
        if(vars.safari.positionOffset && swiper.slidesSizesGrid){
            swiper.setTranslate(swiper.translate + vars.safari.positionOffset * (swiper.slidesSizesGrid[index] || 0))
            swiper.updateProgress()
            swiper.updateActiveIndex()
            swiper.updateSlidesClasses()
        }
        vars.safari.restoring = false
    }

    function scheduleSwiperRefresh(attempt = 0){
        clearTimeout(vars.safari.swiperRefreshTimer)
        const wait = safariIsInteracting() ? Math.max(80, vars.safari.interactionUntil - Date.now() + 16) : (attempt ? 120 : 0)
        vars.safari.swiperRefreshTimer = setTimeout(()=>{
            vars.safari.swiperRefreshTimer = null
            if(!isShowing) return
            if(safariIsInteracting()) { scheduleSwiperRefresh(); return }
            if(!swiperHasLayout()){
                if(attempt < 10) scheduleSwiperRefresh(attempt + 1)
                return
            }
            if(vars.safari.slidesDirty) { refreshSafariSlides(); return }
            const hadSwiper = !!vars.safari.swiper
            ensureSwiper()
            const swiper = vars.safari.swiper
            if(hadSwiper && swiper && !swiper.destroyed){
                vars.safari.restoring = true
                swiper.update()
                restoreSafariPosition()
                vars.safari.restoring = false
            }
            // ResizeObserver belongs to Swiper. Do not repeatedly re-center a
            // free-mode carousel after successful layout while the user scrolls.
        }, wait)
    }

    function ensureSwiper(attempt = 0){
        if(vars.safari.swiper) return true
        if(!swiperHasLayout()) return false
        if(typeof Swiper === 'undefined'){
            if(attempt < 10 && !vars.safari.swiperRetryTimer){
                vars.safari.swiperRetryTimer = setTimeout(()=>{
                    vars.safari.swiperRetryTimer = null
                    ensureSwiper(attempt + 1)
                }, 120)
            }
            return false
        }
        instanceSwiper()
        return !!vars.safari.swiper
    }

    function instanceSwiper(){
        if(vars.safari.swiper || typeof Swiper === 'undefined') return
        vars.safari.swiperIsHorizontal = isHorizontal
        const wrapper = document.querySelector('#safariTabs .swiper-wrapper')
        wrapper.replaceChildren(...vars.safari.slides)
        vars.safari.restoring = true
        vars.safari.swiper = new Swiper('#safariTabs', {
            effect: 'coverflow',
            direction: isHorizontal ? 'horizontal' : 'vertical',
            initialSlide: safariPositionIndex(),
            grabCursor: true, freeMode: true, centeredSlides: true,
            slidesPerView: 5, simulateTouch: true, mousewheel: true,
            preventClicks: false,
            coverflowEffect: {rotate: 5, stretch: 0, depth: 100, modifier: 1, slideShadows: false},
            keyboard: {enabled: true, onlyInViewport: true},
            on: {slideChange: ()=>{
                if(safariIsInteracting()) rememberSafariPosition()
            }}
        })
        vars.safari.restoring = false
    }

    function destroySwiper(){
        if(vars.safari.swiper){
            vars.safari.swiper.destroy(true, true)
            vars.safari.swiper = null
        }
    }

    function resetSwiper(){
        rememberSafariPosition(false)
        destroySwiper()
        scheduleSwiperRefresh()
    }

    setEvent('show', ()=>{
        if(vars.safari.swiper && vars.safari.swiperIsHorizontal !== isHorizontal){
            rememberSafariPosition(false)
            destroySwiper()
        }
        if(vars.safari.swiper) vars.safari.swiper.keyboard.enable()
        scheduleSwiperRefresh()
        // A WebKit reload/content recovery may clear this cache while Safari
        // still regards its frames as delivered. Report IDs, never image data.
        sendStatus(JSON.stringify({type: 'safariViewReady', inventoryReady: !!vars.safari.inventoryReady, position: vars.safari.position || null, previewIds:
            Object.values(vars.safari.tabs).filter(tab=>tab.previewURL).map(tab=>Number(tab.info.id))}))
    })
    setEvent('exit', ()=>{
        rememberSafariPosition()
        vars.safari.interactionUntil = 0
        clearTimeout(vars.safari.swiperRefreshTimer)
        clearTimeout(vars.safari.swiperRetryTimer)
        vars.safari.swiperRefreshTimer = null
        vars.safari.swiperRetryTimer = null
        if(vars.safari.swiper) vars.safari.swiper.keyboard.disable()
    })

    function upsertSafariTab(tabInfo){
        let tab = vars.safari.tabs[tabInfo.id]
        if(!tab){
            const slide = document.createElement('div')
            slide.className = 'swiper-slide'
            slide.id = 'safariTab' + tabInfo.id
            slide.setAttribute('tabId', tabInfo.id)
            const hue = Math.abs(tabInfo.id * 9973 % 360)
            slide.style.background = `radial-gradient(ellipse, hsla(${hue}, 85%, 70%, .4), transparent 70%)`
            const img = document.createElement('img')
            img.hidden = true
            img.alt = '' // The adjacent title names the same tab.
            const title = document.createElement('div')
            title.className = 'safari-tab-title'
            slide.append(img, title)
            tab = vars.safari.tabs[tabInfo.id] = {slide, img, title}
        }
        // Also upgrade retained cards when new HTML arrives in a warm context.
        if(!tab.caption){
            tab.caption = document.createElement('div')
            tab.caption.className = 'safari-tab-caption'
            tab.icon = document.createElement('span')
            tab.icon.className = 'safari-tab-icon'
            tab.icon.setAttribute('aria-hidden', 'true')
            tab.iconFallback = document.createElement('span')
            tab.iconFallback.textContent = '🌐'
            tab.icon.append(tab.iconFallback)
            tab.caption.append(tab.icon, tab.title)
            tab.slide.append(tab.caption)
        }
        tab.info = tabInfo
        // Website-controlled titles must never be interpolated as HTML.
        const title = tabInfo.title || tabInfo.url || 'Safari tab'
        tab.title.textContent = title
        tab.slide.title = title
        tab.slide.setAttribute('aria-label', title)
        updateSafariTabIcon(tab, tabInfo.favIconUrl)
        return tab
    }

    function updateSafariTabIcon(tab, source){
        // Never interpret website metadata as markup or load browser-internal,
        // file or script URLs in the native host. No favicon lookup service.
        let url = ''
        if(typeof source === 'string' && source.length <= 32768){
            try {
                const parsed = new URL(source)
                if(['https:', 'http:'].includes(parsed.protocol) && !parsed.username && !parsed.password) url = parsed.href
                else if(/^data:image\/(png|gif|jpeg|webp|x-icon|vnd\.microsoft\.icon);base64,[a-z0-9+/=]+$/i.test(source)) url = source
            } catch(_) {}
        }
        if(tab.iconURL === url) return
        releaseSafariTabIcon(tab)
        tab.iconURL = url
        if(!url) return
        const img = document.createElement('img')
        img.alt = ''
        img.referrerPolicy = 'no-referrer'
        img.hidden = true
        tab.iconImage = img
        img.onload = ()=>{
            if(tab.iconImage !== img) return
            img.hidden = false
            tab.iconFallback.hidden = true
        }
        img.onerror = ()=>{
            if(tab.iconImage !== img) return
            releaseSafariTabIcon(tab)
        }
        tab.icon.append(img)
        img.src = url
    }

    function releaseSafariTabIcon(tab){
        if(tab.iconImage){
            tab.iconImage.onload = null
            tab.iconImage.onerror = null
            tab.iconImage.removeAttribute('src')
            tab.iconImage.remove()
            tab.iconImage = null
        }
        if(tab.iconFallback) tab.iconFallback.hidden = false
    }

    function syncSafariTabs(tabInfos, position = null){
        tabInfos = tabInfos.filter(info=>info && Number.isSafeInteger(info.id) && info.id >= 0)
        if(!vars.safari.position && position) vars.safari.position = position
        rememberSafariPosition(false)
        const openIds = new Set(tabInfos.map(tab=>String(tab.id)))
        vars.safari.restoring = true
        for(const id of Object.keys(vars.safari.tabs)){
            if(!openIds.has(id)) removeSafariTab(id, false)
        }
        vars.safari.tabInfos = Object.fromEntries(tabInfos.map(info=>[info.id, info]))
        vars.safari.inventoryReady = true
        vars.safari.order = vars.safari.order.filter(id=>openIds.has(String(id)))
        const known = new Set(vars.safari.order)
        for(const info of tabInfos){
            if(!known.has(info.id)){vars.safari.order.push(info.id); known.add(info.id)}
        }
        // Metadata updates titles of existing previews. Never create a card
        // for a tab that Safari has not captured yet.
        for(const info of tabInfos){
            if(vars.safari.tabs[info.id]) upsertSafariTab(info)
        }
        vars.safari.restoring = false
        refreshSafariSlides()
    }

    function refreshSafariSlides(force = false){
        const slides = vars.safari.order.map(id=>vars.safari.tabs[id])
            .filter(tab=>tab?.previewURL).map(tab=>tab.slide)
        const changed = slides.length !== vars.safari.slides.length || slides.some((slide, index)=>slide !== vars.safari.slides[index])
        if(!changed && !force) return
        if(!force && safariIsInteracting()){
            vars.safari.slidesDirty = true
            scheduleSwiperRefresh()
            return
        }
        rememberSafariPosition(false)
        vars.safari.restoring = true
        vars.safari.slides = slides
        vars.safari.slidesDirty = false
        const wrapper = document.querySelector('#safariTabs .swiper-wrapper')
        // Only insert/remove changed cards. Moving the entire wrapper destroys
        // pointer targets and lets activeIndex refer to a different tab.
        const included = new Set(slides)
        for(const child of Array.from(wrapper.children)) if(!included.has(child)) child.remove()
        slides.forEach((slide, index)=>{
            if(wrapper.children[index] !== slide) wrapper.insertBefore(slide, wrapper.children[index] || null)
        })
        vars.safari.restoring = false
        scheduleSwiperRefresh()
    }

    function releaseSafariPreview(tab){
        if(tab.previewURL) URL.revokeObjectURL(tab.previewURL)
        tab.previewURL = null
        tab.previewChars = 0
        tab.previewFingerprint = null
        if(tab.img){
            // Detach handlers before revoking/resetting the old resource.
            tab.img.onload = null
            tab.img.onerror = null
            tab.img.removeAttribute('src')
            tab.img.hidden = true
        }
    }

    function trimSafariPreviews(){
        const previews = Object.values(vars.safari.tabs).filter(tab=>tab.previewURL)
            .sort((a, b)=>Number(b.info.id === vars.safari.position?.id) - Number(a.info.id === vars.safari.position?.id) || b.previewAt - a.previewAt)
        let chars = 0
        previews.forEach((tab, index)=>{
            chars += tab.previewChars
            if(index >= 60 || chars > 8 * 1024 * 1024) releaseSafariPreview(tab)
        })
    }

    function addScreenshot(blob, tabInfo){
        // Inventory is authoritative: late frames must not resurrect closed tabs.
        const currentInfo = vars.safari.tabInfos[tabInfo.id]
        if(!blob || !currentInfo) return
        const tab = upsertSafariTab(currentInfo)
        let first = 2166136261, second = 5381
        for(let i=0; i<blob.length; i++){
            first = Math.imul(first ^ blob.charCodeAt(i), 16777619)
            second = Math.imul(second, 33) ^ blob.charCodeAt(i)
        }
        const fingerprint = `${blob.length}:${first >>> 0}:${second >>> 0}`
        if(tab.previewURL && tab.previewFingerprint === fingerprint) return
        const bytes = Uint8Array.from(atob(blob), char=>char.charCodeAt(0))
        const url = URL.createObjectURL(new Blob([bytes], {type: 'image/jpeg'}))
        releaseSafariPreview(tab)
        // Use a new element per resource: a queued error from a replaced image
        // must never run the replacement image's handler and evict its preview.
        const img = document.createElement('img')
        img.alt = ''
        tab.img.replaceWith(img)
        tab.img = img
        tab.previewURL = url
        tab.previewFingerprint = fingerprint
        tab.previewChars = blob.length
        tab.previewAt = Date.now()
        tab.img.onerror = ()=>{
            if(tab.previewURL !== url) return
            releaseSafariPreview(tab)
            refreshSafariSlides()
        }
        tab.img.src = url
        tab.img.hidden = false
    }

    function applySafariScreenshots(items){
        for(const item of items) addScreenshot(item.blob, item.tabInfo)
        trimSafariPreviews()
        refreshSafariSlides()
    }

    function clickedOnSafariTab(id){
        const tab = vars.safari.tabs[id]
        if(!tab || !tab.previewURL) return
        const index = vars.safari.slides.findIndex(slide=>String(slide.getAttribute('tabId')) === String(id))
        vars.safari.position = {id: Number(id), index: Math.max(0, index)}
        vars.safari.positionOffset = 0
        restoreSafariPosition()
        // One bridge message binds focus and selection to this extension.
        // Native queues the selection only after closing and focusing its owner.
        focusOnMe(JSON.stringify({type: 'clickedOn', id: Number(id), index: Math.max(0, index)}))
    }

    function removeSafariTab(id, refresh = true){
        rememberSafariPosition(false)
        const tab = vars.safari.tabs[id]
        if(tab){
            releaseSafariPreview(tab)
            releaseSafariTabIcon(tab)
            tab.slide.remove()
            delete vars.safari.tabs[id]
        }
        if(refresh) refreshSafariSlides()
    }

    function animateRemoveSafariTab(id){
        removeSafariTab(id)
        return false
    }

    function confirmSafariTabs(ids){
        const openIds = new Set(ids.map(String))
        for(const id of Object.keys(vars.safari.tabs)){
            if(!openIds.has(id)) removeSafariTab(id, false)
        }
        refreshSafariSlides()
    }

    if(!vars.safari.interactionHandlersBound){
        vars.safari.interactionHandlersBound = true
        for(const name of ['wheel', 'pointerdown', 'pointermove', 'touchstart', 'touchmove', 'keydown']){
            document.addEventListener(name, noteSafariInteraction, {passive: true})
        }
    }

    if(!vars.safari.clickHandlerBound){
        vars.safari.clickHandlerBound = true
        document.addEventListener('click', event=>{
            const slide = event.target.closest('#safariTabs .swiper-slide')
            if(slide) clickedOnSafariTab(slide.getAttribute('tabId'))
        })
        document.addEventListener('contextmenu', event=>{
            const slide = event.target.closest('#safariTabs .swiper-slide')
            if(slide){
                event.preventDefault()
                animateRemoveSafariTab(slide.getAttribute('tabId'))
            }
        })
    }
</script>
