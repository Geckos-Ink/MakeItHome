<html>
    <head>
        <script src="./jquery-3.7.1.min.js"></script>

        <link rel="stylesheet" href="./fontawesome/css/all.min.css">

        <!-- OsenUI -->
        <link rel="stylesheet" href="./onsenui/css/onsenui.css">
        <link rel="stylesheet" href="./onsenui/css/dark-onsen-css-components.min.css">
        <script src="./onsenui/js/onsenui.min.js"></script>

        <!-- pickr (color picker) -->
        <script src="./thirds/pickr.min.js"></script>
        <link rel="stylesheet" href="./thirds/pickr.nano.min.css">

        <!-- Bootstrap 5 -->
        <link href="./thirds/bootstrap.min.css" rel="stylesheet">
        <script src="./thirds/bootstrap.bundle.min.js"></script>

        <style>
            @font-face {
                font-family: Lato;
                src: url(Lato-Light.ttf);
                font-weight: normal;
            }

            @font-face {
                font-family: Lato;
                src: url(Lato-Regular.ttf);
                font-weight: bold;
            }

            @font-face {
                font-family: OxygenMono;
                src: url(OxygenMono-Regular.ttf);
                font-weight: normal;
            }

            body {
                font-family: Lato;
            }

            .appExtension {
                width: 100%;
                height: 100%;
            }

            body {
                background-color: rgba(0,0,0,0) !important;
            }

            .extensionPlaceholder {
                margin: 10px;
                font-weight: bold;
                background-color: rgba(255,255,255,0.25);
            }
        </style>
    </head>
    <body oncontextmenu="return false;">
        
    </body>

    <script>
        let $body = $(document.body)
        let vars = {}
        let isHorizontal = true
        let curBundleId = ''
        let isShowing = false
        let version = ''

        function clearExtensionEvents(bundleId){
            delete vars[bundleId+'_event_show']
            delete vars[bundleId+'_event_exit']
        }

        function createAppExtension(bundleId){
            bundleId = bundleId.replaceAll(".", "-")

            clearExtensionEvents(bundleId)
            $("#"+bundleId).remove() // ensure there are no duplicates

            let $ext = $('<div class="appExtension" id="'+bundleId+'"><div class="extensionPlaceholder">Extension not already loaded...</div></div>')
            $body.append($ext)
        }

        let settingContentBundleId = null

        function decodeContent(content){
            let binary = atob(content)
            let bytes = Uint8Array.from(binary, character => character.charCodeAt(0))
            return new TextDecoder('utf-8').decode(bytes)
        }

        function setContent(bundleId, content){
            bundleId = bundleId.replaceAll(".", "-")
            let $ext = $('#'+bundleId)

            if($ext.length === 0){
                createAppExtension(bundleId)
                $ext = $('#'+bundleId)
            }

            $ext.stop(true, true)
            $ext.empty()

            let decoded = (()=>{
                try {
                    return decodeContent(content)
                }
                catch(err){
                    console.error("setContent decode error", err)
                    return ""
                }
            })()

            // The injected scripts run synchronously inside .html() and may call
            // setEvent() before this extension was ever shown, when curBundleId
            // is still empty: expose the injecting bundleId for the duration
            settingContentBundleId = bundleId
            try {
                $ext.html(decoded)
            }
            finally {
                settingContentBundleId = null
            }

            // The overscreen can be opened before the browser extension has
            // finished sending its HTML. In that case showAppExtension() ran
            // before the injected code could register its `show` callback.
            // Replay that callback now that the content (and its libraries) is
            // installed, otherwise components such as Swiper stay uninitialised
            // until the overscreen is closed and opened a second time.
            if(isShowing && curBundleId === bundleId){
                let appEvent = vars[bundleId+'_event_show']
                if(appEvent){
                    try {
                        appEvent()
                    }
                    catch(err){
                        console.error("Extension show event after content load failed", err)
                    }
                }
            }
        }

        function showAppExtension(bundleId, _isHorizontal=true){
            isHorizontal = _isHorizontal

            $(".appExtension").hide()

            bundleId = bundleId.replaceAll(".", "-")
            curBundleId = bundleId

            let $ext = $('#'+bundleId)
            $ext.show()

            // Check for event
            let appEvent = vars[bundleId+'_event_show']
            if(appEvent)
                appEvent()    
            
            isShowing = true
        }

        function exitingAppExtension(){
            let appEvent = vars[curBundleId+'_event_exit']
            if(appEvent)
                appEvent() 
            
            isShowing = false
        }

        function setEvent(name, func){
            let target = settingContentBundleId || curBundleId
            vars[target+'_event_'+name] = func
        }

        function sendMessage(message) {            
            if(typeof(message) == 'object')
                message = JSON.stringify(message)

            console.log("sending message", message)
            message = encodeURIComponent(message)        

            setTimeout(()=>{
                window.location.href = "myapp://message?text=" + message;  
            }, Math.ceil(Math.random()*25))            
        }

        function sendStatus(status){
            sendMessage({type:'status', value: status})
        }

        function closeOverscreen(){
            sendMessage({type:'closeOverscreen'})
        }

        function focusOnMe(){
            sendMessage({type:'focusOnMe'})
        }

        function setVersion(v){
            version = v
        }
    </script>
</html>
